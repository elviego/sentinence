<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background pill -->
  <rect width="128" height="128" rx="28" fill="#1E40AF"/>

  <!-- Horizontal text lines representing sentences -->
  <!-- Line 1 — Claim (blue accent) -->
  <rect x="20" y="30" width="56" height="7" rx="3.5" fill="#93C5FD"/>
  <rect x="82" y="30" width="26" height="7" rx="3.5" fill="#3B82F6"/>

  <!-- Line 2 — Evidence (green) -->
  <rect x="20" y="46" width="36" height="7" rx="3.5" fill="#4ADE80"/>
  <rect x="62" y="46" width="46" height="7" rx="3.5" fill="#86EFAC"/>

  <!-- Line 3 — Opinion (purple) -->
  <rect x="20" y="62" width="64" height="7" rx="3.5" fill="#C084FC"/>
  <rect x="90" y="62" width="18" height="7" rx="3.5" fill="#A855F7"/>

  <!-- Line 4 — Counter (orange) -->
  <rect x="20" y="78" width="28" height="7" rx="3.5" fill="#FB923C"/>
  <rect x="54" y="78" width="54" height="7" rx="3.5" fill="#FDBA74"/>

  <!-- Line 5 — Other (gray) -->
  <rect x="20" y="94" width="44" height="7" rx="3.5" fill="#94A3B8"/>

  <!-- Left colour bar accent -->
  <rect x="10" y="26" width="4" height="79" rx="2" fill="white" opacity="0.25"/>
</svg>
